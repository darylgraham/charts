name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Sync Chart versions from CHANGELOGs
        run: |
          changed=false
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            changelog="${chart_dir}CHANGELOG.md"
            chart_yaml="${chart_dir}Chart.yaml"
            if [ ! -f "$changelog" ]; then
              echo "$chart_name: no CHANGELOG.md, skipping"
              continue
            fi
            CHANGELOG_VERSION=$(grep -m1 '^## \[[0-9]' "$changelog" | sed 's/## \[\([^]]*\)\].*/\1/')
            CHART_VERSION=$(grep '^version:' "$chart_yaml" | awk '{print $2}')
            echo "$chart_name: CHANGELOG=$CHANGELOG_VERSION  Chart.yaml=$CHART_VERSION"
            if [ "$CHANGELOG_VERSION" != "$CHART_VERSION" ]; then
              sed -i "s/^version:.*/version: $CHANGELOG_VERSION/" "$chart_yaml"
              git add "$chart_yaml"
              git commit -m "chore($chart_name): bump version to $CHANGELOG_VERSION [skip ci]"
              changed=true
            fi
          done
          if [ "$changed" = true ]; then
            git push
          fi

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1

      - name: Fetch chart dependencies
        run: make chart-deps

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
