name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELMFMT_VERSION: 0.7.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1

      - name: Install helm-unittest plugin
        run: make init

      - name: Install helmfmt
        run: |
          base="https://github.com/digitalstudium/helmfmt/releases/download/v${HELMFMT_VERSION}"
          archive="helmfmt_Linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/helmfmt_${HELMFMT_VERSION}_checksums.txt"
          grep " ${archive}\$" "helmfmt_${HELMFMT_VERSION}_checksums.txt" | sha256sum -c -
          mkdir helmfmt-bin
          tar -xzf "${archive}" -C helmfmt-bin
          bin="$(find "$PWD/helmfmt-bin" -type f -name helmfmt)"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: Lint
        run: make lint

      - name: Unit test
        run: make test

      - name: Format check
        run: make format
