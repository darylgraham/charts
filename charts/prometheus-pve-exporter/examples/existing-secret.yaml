# Credentials from a Secret you manage yourself (for example via External Secrets or SOPS).
# Use when credentials must not appear in Helm values. Create the Secret beforehand, e.g.:
#   kubectl create secret generic pve-credentials --from-literal=user=monitoring@pve --from-literal=password=CHANGE_ME
# For token authentication also set tokenNameKey and tokenValueKey to the keys in your Secret.
pve:
  existingSecret: pve-credentials
  userKey: user
  passwordKey: password
