# Default values for prometheus-pve-exporter.

# Number of exporter replicas.
replicaCount: 1

image:
  # Exporter image repository.
  repository: prompve/prometheus-pve-exporter
  # Image pull policy.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion (tags have no "v" prefix).
  tag: ""

# Secrets used to pull the image from a private registry.
imagePullSecrets: []
# Overrides the chart name.
nameOverride: ""
# Overrides the fully qualified release name.
fullnameOverride: ""

serviceAccount:
  # Create a service account.
  create: true
  # Mount the service account token into the pod; the exporter does not talk to the Kubernetes API.
  automount: false
  # Annotations added to the service account.
  annotations: {}
  # Name of the service account. Defaults to the fullname when create is true, otherwise "default".
  name: ""

# Annotations added to the pod.
podAnnotations: {}
# Extra labels added to the pod.
podLabels: {}

# Pod-level security context. The image runs as uid 101.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # Service type.
  type: ClusterIP
  # Service port only; the exporter always listens on 9221 (the named "http" container port).
  port: 9221

pve:
  # Proxmox VE user, e.g. "monitoring@pve" (exported as PVE_USER). Required unless existingSecret is set.
  user: ""
  # Password for password authentication. Cannot be combined with token authentication.
  password: ""
  # API token name for token authentication, e.g. "exporter" (PVE_TOKEN_NAME). Setting it selects token mode.
  tokenName: ""
  # API token value (PVE_TOKEN_VALUE). Required with tokenName.
  tokenValue: ""
  # Verify the Proxmox server certificate (PVE_VERIFY_SSL). Ignored, and rejected when false, in config
  # mode: set verify_ssl in the pve.yml instead.
  verifySsl: true
  # Name of an existing Secret holding the credentials; when set, the chart creates no Secret and
  # the user, password and token values above are not stored anywhere. The authentication mode is still
  # chosen from them: a non-empty tokenName (or tokenNameKey/tokenValueKey) selects token mode and a
  # password combined with token mode is rejected.
  existingSecret: ""
  # Key of the user in the Secret (chart-managed or existing).
  userKey: user
  # Key of the password in the Secret. Used in password mode (the default mode).
  passwordKey: password
  # Key of the token name in the Secret. Setting this or tokenValueKey selects token mode (the key
  # defaults to "tokenName"). Not allowed in config mode.
  tokenNameKey: ""
  # Key of the token value in the Secret; falls back to "tokenValue" when token mode is selected.
  # Not allowed in config mode.
  tokenValueKey: ""

config:
  # Contents of a pve.yml (default module) mounted at /etc/prometheus/pve.yml from a chart-created Secret
  # (it holds credentials, so never a ConfigMap). Enables config mode: no PVE_* variables are set and
  # pve.user, pve.password, pve.tokenName, pve.tokenValue and pve.existingSecret must be unset.
  # Mutually exclusive with existingSecret.
  pveYml: ""
  # Name of an existing Secret holding a pve.yml, mounted at /etc/prometheus/pve.yml. Enables config mode.
  existingSecret: ""
  # Key of the pve.yml in the existing Secret.
  existingSecretKey: pve.yml

tls:
  # Name of a Secret holding a CA certificate, mounted read-only at caMountPath. In env mode the chart
  # also sets REQUESTS_CA_BUNDLE=<caMountPath>/<caKey> so the exporter trusts it. In config mode set
  # `verify_ssl: <caMountPath>/<caKey>` in your pve.yml; no variable is set.
  caSecret: ""
  # Key of the CA certificate in the Secret.
  caKey: ca.crt
  # Directory the CA Secret is mounted at.
  caMountPath: /etc/prometheus/ca

serviceMonitor:
  # Render a Prometheus Operator ServiceMonitor (requires the monitoring.coreos.com CRDs).
  enabled: false
  # Namespace of the ServiceMonitor. Defaults to the release namespace.
  namespace: ""
  # Extra labels, e.g. `release: prometheus` so the Operator selects it.
  labels: {}
  # Annotations added to the ServiceMonitor.
  annotations: {}
  # Scrape interval.
  interval: 30s
  # Scrape timeout; must not exceed the interval.
  scrapeTimeout: 10s
  # Query parameters sent to /pve on every scrape. Always sent explicitly, as strings.
  params:
    # Module from pve.yml to use.
    module: default
    # Collect cluster metrics ("1" or "0").
    cluster: "1"
    # Collect node metrics ("1" or "0").
    node: "1"
  # Proxmox VE hosts to scrape through this exporter; each one renders one endpoint with its own
  # `target` parameter and an `instance` label set to the target. An entry is either a host string
  # or a map { target, module, cluster, node } whose optional keys override `params` for that
  # endpoint (`target` is required in map form; a null override falls back to `params`; empty
  # targets are rejected). With no targets, one endpoint is rendered without a `target` parameter or
  # `instance` relabeling (exporter running on the Proxmox VE host itself).
  targets: []
  # Extra relabelings appended to every endpoint after the chart's own.
  relabelings: []
  # Metric relabelings applied to every endpoint.
  metricRelabelings: []

# Container resource requests and limits.
resources: {}

# Additional exporter arguments appended to the container args, e.g. ["--no-collector.config"].
extraArgs: []

# Liveness probe for the exporter container.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Readiness probe for the exporter container.
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Node selector for pod scheduling.
nodeSelector: {}
# Tolerations for pod scheduling.
tolerations: []
# Affinity rules for pod scheduling.
affinity: {}
