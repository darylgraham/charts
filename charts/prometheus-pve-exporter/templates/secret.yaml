{{- if not .Values.pve.existingSecret }}
{{- include "prometheus-pve-exporter.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-pve-exporter.fullname" . }}
  labels:
    {{- include "prometheus-pve-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.pve.userKey }}: {{ .Values.pve.user | quote }}
  {{- if include "prometheus-pve-exporter.tokenAuth" . }}
  {{ default "tokenName" .Values.pve.tokenNameKey }}: {{ .Values.pve.tokenName | quote }}
  {{ default "tokenValue" .Values.pve.tokenValueKey }}: {{ .Values.pve.tokenValue | quote }}
  {{- else }}
  {{ .Values.pve.passwordKey }}: {{ .Values.pve.password | quote }}
  {{- end }}
{{- end }}
