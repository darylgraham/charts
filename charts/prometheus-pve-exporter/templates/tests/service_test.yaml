suite: service and service account
templates:
  - templates/service.yaml
  - templates/serviceaccount.yaml
release:
  name: pve

tests:
  - it: renders a ClusterIP service on 9221 targeting the http port
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 9221
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: pve

  - it: honours service type and port
    template: templates/service.yaml
    set:
      service.type: NodePort
      service.port: 9300
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 9300

  - it: creates a service account without token automount
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: pve-prometheus-pve-exporter
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: passes service account annotations and name
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.name: custom-sa
      serviceAccount.annotations:
        a: b
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
      - equal:
          path: metadata.annotations.a
          value: b

  - it: renders no service account when disabled
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
