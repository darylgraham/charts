suite: credentials
templates:
  - templates/deployment.yaml
  - templates/secret.yaml
  - templates/service.yaml
  - templates/NOTES.txt
release:
  name: pve
  namespace: monitoring

tests:
  - it: renders a Secret and PVE_USER/PVE_PASSWORD env for password authentication
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
    asserts:
      - isKind:
          of: Secret
        template: templates/secret.yaml
      - equal:
          path: metadata.name
          value: pve-prometheus-pve-exporter
        template: templates/secret.yaml
      - equal:
          path: stringData
          value:
            user: monitoring@pve
            password: pw-placeholder
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_USER
            valueFrom:
              secretKeyRef:
                name: pve-prometheus-pve-exporter
                key: user
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pve-prometheus-pve-exporter
                key: password
        template: templates/deployment.yaml

  - it: uses token env and no PVE_PASSWORD for token authentication
    set:
      pve.user: monitoring@pve
      pve.tokenName: exporter
      pve.tokenValue: token-placeholder
    asserts:
      - equal:
          path: stringData
          value:
            user: monitoring@pve
            tokenName: exporter
            tokenValue: token-placeholder
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_TOKEN_NAME
            valueFrom:
              secretKeyRef:
                name: pve-prometheus-pve-exporter
                key: tokenName
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_TOKEN_VALUE
            valueFrom:
              secretKeyRef:
                name: pve-prometheus-pve-exporter
                key: tokenValue
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pve-prometheus-pve-exporter
                key: password
        template: templates/deployment.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[1].name
          pattern: PVE_PASSWORD
        template: templates/deployment.yaml

  - it: rejects a render without a user
    set:
      pve.password: pw-placeholder
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.user is required unless pve.existingSecret is set

  - it: rejects a render with no credentials at all
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.user is required unless pve.existingSecret is set

  - it: rejects a user without password or token
    set:
      pve.user: monitoring@pve
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.password (or pve.tokenName and pve.tokenValue) is required unless pve.existingSecret is set

  - it: rejects a token name without a token value
    set:
      pve.user: monitoring@pve
      pve.tokenName: exporter
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.tokenValue is required for token authentication

  - it: rejects password combined with token
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
      pve.tokenName: exporter
      pve.tokenValue: token-placeholder
    template: templates/secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.password cannot be combined with token authentication (pve.tokenName, pve.tokenNameKey or pve.tokenValueKey); set only one

  - it: references an existing Secret with default keys and renders no Secret
    set:
      pve.existingSecret: my-pve
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_USER
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: user
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: password
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.metadata.annotations
        template: templates/deployment.yaml

  - it: uses configured key names with an existing Secret
    set:
      pve.existingSecret: my-pve
      pve.userKey: u
      pve.passwordKey: p
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_USER
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: u
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: p

  - it: selects token mode from configured token key names with an existing Secret
    set:
      pve.existingSecret: my-pve
      pve.tokenNameKey: tn
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_TOKEN_NAME
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: tn
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_TOKEN_VALUE
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: tokenValue
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pve
                key: password

  - it: rejects a password value combined with token keys on an existing Secret
    set:
      pve.existingSecret: my-pve
      pve.password: pw-placeholder
      pve.tokenNameKey: tn
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: pve.password cannot be combined with token authentication (pve.tokenName, pve.tokenNameKey or pve.tokenValueKey); set only one

  - it: verifies TLS by default
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_VERIFY_SSL
            value: "true"

  - it: disables TLS verification when verifySsl is false
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
      pve.verifySsl: false
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PVE_VERIFY_SSL
            value: "false"

  - it: adds a Secret checksum annotation alongside user pod annotations
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
      podAnnotations:
        a: b
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: ^[0-9a-f]{64}$
      - equal:
          path: spec.template.metadata.annotations.a
          value: b

  - it: keeps the password out of every document except the Secret
    set:
      pve.user: monitoring@pve
      pve.password: pw-placeholder
    asserts:
      - equal:
          path: stringData.password
          value: pw-placeholder
        template: templates/secret.yaml
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: pve-prometheus-pve-exporter
                  key: user
            - name: PVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pve-prometheus-pve-exporter
                  key: password
            - name: PVE_VERIFY_SSL
              value: "true"
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].args
        template: templates/deployment.yaml
      - equal:
          path: spec
          value:
            type: ClusterIP
            ports:
              - name: http
                port: 9221
                protocol: TCP
                targetPort: http
            selector:
              app.kubernetes.io/name: prometheus-pve-exporter
              app.kubernetes.io/instance: pve
        template: templates/service.yaml
      - notMatchRegexRaw:
          pattern: pw-placeholder
        template: templates/NOTES.txt

  - it: keeps the token out of NOTES
    set:
      pve.user: monitoring@pve
      pve.tokenName: exporter
      pve.tokenValue: token-placeholder
    template: templates/NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: token-placeholder
