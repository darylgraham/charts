{{- if .Values.config.pveYml }}
{{- include "prometheus-pve-exporter.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-pve-exporter.configSecretName" . }}
  labels:
    {{- include "prometheus-pve-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  pve.yml: {{ .Values.config.pveYml | quote }}
{{- end }}
